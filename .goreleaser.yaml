# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release build: self-contained (no cgo) binaries for each platform, archives
# carrying the license texts, an SPDX SBOM per archive, and checksums.txt
# signed keylessly with Sigstore, uploaded to a draft GitHub release. The
# release workflow (.github/workflows/release.yml) then attests the archives
# and binaries, verifies the draft the way a user would, and publishes it.
#
# Dry run, with no tag, no signing and nothing published:
#   scripts/install-release-tools.sh
#   goreleaser release --snapshot --clean --skip=sign
version: 2

project_name: saashound

before:
  hooks:
    - sh scripts/third-party-licenses.sh build/THIRD_PARTY_LICENSES.txt

builds:
  - id: saashound
    main: ./cmd/saashound
    binary: saashound
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # Reproducible: no local paths and no build timestamp, so the same commit,
    # Go version (`go version -m saashound` prints it) and flags give the same
    # bytes.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/HarrisonHong/saashound/internal/version.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: saashound
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      mode: 0755
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mode: 0644
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mode: 0644
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: build/THIRD_PARTY_LICENSES.txt
        strip_parent: true
        info:
          mode: 0644
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  # Keyless: cosign signs with a short-lived Fulcio certificate issued to the
  # release workflow's OIDC identity and records the signature in Rekor. The
  # bundle carries the certificate and the log entry, so verification needs
  # no key from us.
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

changelog:
  use: github-native

release:
  # The workflow publishes the draft only after it is attested and verified.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  footer: |
    ## Verify

    Every archive and binary in this release carries a GitHub build provenance attestation, and `checksums.txt` is signed with Sigstore. Check a download before you run it:

    ```sh
    gh attestation verify saashound_{{ .Version }}_linux_amd64.tar.gz --repo HarrisonHong/saashound --signer-workflow HarrisonHong/saashound/.github/workflows/release.yml
    ```

    Or, without the GitHub CLI, check the signed checksums with [cosign](https://docs.sigstore.dev/cosign/system_config/installation/):

    ```sh
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity https://github.com/HarrisonHong/saashound/.github/workflows/release.yml@refs/tags/{{ .Tag }} && sha256sum --ignore-missing -c checksums.txt
    ```
