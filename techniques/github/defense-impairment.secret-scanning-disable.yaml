id: github.defense-impairment.secret-scanning-disable
name: Disable secret scanning and push protection on a repository
description: >
  The attacker turns off secret scanning and its push protection so committed
  credentials are neither blocked nor flagged. This creates a run-owned
  repository (which starts with both enabled) and disables both; cleanup
  restores the recorded status and deletes the repository. It ships flagged
  evidence rules-only and runs lab-only: SigmaHQ's "Github Push Protection
  Disabled" rule lists the org, business and custom-pattern actions but not the
  repository-level repository_secret_scanning_push_protection.disable this
  emits, which is the gap this technique measures.
author: [saashound-maintainers]
platform: github
attack: [T1562.001]
evidence: rules-only
safety: {production_safe: false, modifies_existing: false, third_party_contact: none}
steps:
  - id: repo
    op: github.repo.create
  - id: disable
    op: github.repo.disable_secret_scanning
    with: {repo: "{{steps.repo.id}}"}
expect:
  - after: disable
    source: github.audit_log
    match: {action: repository_secret_scanning_push_protection.disable, repo_id: "{{steps.repo.repo_id}}"}
cleanup:
  order: [disable, repo]
